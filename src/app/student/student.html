@for (item of students; track $index) 
{
    <p [ngStyle]="{'backgroundColor': item.gender == 'F' ? 'pink' : 'lightblue'}">
        {{$index + 1}}) <strong>Nome:</strong> {{item.name}} -
        <strong>Città:</strong> {{item.city}} -
        <strong>Genere:</strong> {{item.gender}} -
        <strong>Presente:</strong> {{item.presente}}
    </p>
}
